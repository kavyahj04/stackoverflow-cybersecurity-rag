# Render Blueprint: Render reads this file from the repo and creates the API service.
# Secrets are marked sync: false, so Render asks for them in the dashboard; they never go in git.
services:
  - type: web
    name: secqa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: virginia              # next to the Supabase database (us-east-1)
    plan: starter                 # 512 MB, always on. The server uses ~290 MB.
    healthCheckPath: /api/health  # Render only switches to a new version once this answers OK
    autoDeploy: true              # every push to main redeploys
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS         # the Vercel address of the frontend, e.g. https://secqa.vercel.app
        sync: false
      - key: CLIENT_IP_HEADER     # Render sits behind Cloudflare, which puts the visitor's address here
        value: True-Client-IP
      - key: ASK_PER_MINUTE
        value: "10"
      - key: ASK_PER_DAY
        value: "300"
